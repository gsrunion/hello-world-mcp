spring.application.name=hello-world-mcp
spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.model.chat=none
spring.ai.openai.api-key=${OPENAI_API_KEY:replace-with-your-openai-api-key}

delegate.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
delegate.providers.openai.api-key=${OPENAI_API_KEY:replace-with-your-openai-api-key}
delegate.providers.example-cloud.base-url=${EXAMPLE_CLOUD_BASE_URL:https://api.example.com}
delegate.providers.example-cloud.api-key=${EXAMPLE_CLOUD_API_KEY:replace-with-your-provider-api-key}

delegate.aliases.openai-general.provider=openai
delegate.aliases.openai-general.model=${OPENAI_MODEL:replace-with-your-openai-model}
delegate.aliases.cloud-general.provider=example-cloud
delegate.aliases.cloud-general.model=${EXAMPLE_CLOUD_MODEL:replace-with-your-cloud-model}
