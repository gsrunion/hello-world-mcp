spring.application.name=hello-world-mcp
spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.client.type=SYNC

# Add remote Streamable HTTP MCP servers here. Example:
# spring.ai.mcp.client.streamable-http.connections.bot-fleet.url=${BOT_FLEET_MCP_URL:https://your-mcp-host.example.com}
# spring.ai.mcp.client.streamable-http.connections.bot-fleet.endpoint=/mcp

# Map local agent aliases to discovered remote MCP tool names. Example:
# delegate.agents.repo-agent=bot_fleet_dispatch_task
