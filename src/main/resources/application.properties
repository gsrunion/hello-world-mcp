spring.application.name=hello-world-mcp
spring.ai.mcp.server.name=hello-world-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:replace-with-your-api-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:replace-with-your-model-name}
